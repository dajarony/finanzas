modules:
  - name: dominio
    file: server/core.mjs
    depends_on: []
  - name: transporte
    file: server/app.mjs
    depends_on: [rutas, http]
  - name: rutas
    file: server/routes.mjs
    depends_on: [almacen, privacidad, http]
  - name: http
    file: server/http.mjs
    depends_on: [dominio]
  - name: almacen
    file: server/store.mjs
    depends_on: [cuentas, movimientos, importador, presupuestos, deudas, panel, conciliacion, copias, demo]
  - name: cuentas
    file: server/store/accounts.mjs
    depends_on: [dominio]
  - name: movimientos
    file: server/store/transactions.mjs
    depends_on: [dominio, cuentas]
  - name: importador
    file: server/store/importer.mjs
    depends_on: [movimientos, cuentas]
  - name: presupuestos
    file: server/store/budgets.mjs
    depends_on: [dominio]
  - name: deudas
    file: server/store/debts.mjs
    depends_on: [dominio]
  - name: panel
    file: server/store/dashboard.mjs
    depends_on: [cuentas, movimientos, presupuestos]
  - name: conciliacion
    file: server/store/reconcile.mjs
    depends_on: [cuentas, movimientos]
  - name: copias
    file: server/store/backup.mjs
    depends_on: [cuentas, dominio]
  - name: demo
    file: server/store/demo.mjs
    depends_on: [cuentas, dominio]
  - name: privacidad
    file: server/vault.mjs
    depends_on: [almacen, cifrado, migracion]
  - name: cifrado
    file: server/vault/crypto.mjs
    depends_on: [dominio]
  - name: migracion
    file: server/vault/migration.mjs
    depends_on: [almacen, cifrado]
  - name: interfaz
    file: web/src/App.tsx
    depends_on: [acceso, formulario-movimiento, copias-ui, api]
  - name: acceso
    file: web/src/features/auth/AccessGate.tsx
    depends_on: [api]
  - name: formulario-movimiento
    file: web/src/features/transactions/NewTransaction.tsx
    depends_on: [api]
  - name: copias-ui
    file: web/src/features/backup/BackupControls.tsx
    depends_on: [api]
  - name: api
    file: web/src/lib/api.ts
    depends_on: []
contracts:
  - name: HTTP-local
    file: contratos/http-api.md
    used_by: [server/routes.mjs, web/src/lib/api.ts, tests/api.test.mjs]
  - name: ECA-oraculo
    file: contratos/eca-oraculo.md
    used_by: [tests/vault.test.mjs, tests/e2e/flows.spec.ts]
